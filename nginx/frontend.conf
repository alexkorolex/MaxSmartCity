server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx-unprivileged writes its own pid/temp files elsewhere; nothing here needs to write
    # to the (read-only) filesystem.

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx defaults to 1m, which silently rejects any real phone photo well before it
    # reaches the backend's own 10MB-per-file check on /reports/{id}/attachments.
    client_max_body_size 12m;

    # Hashed build assets (Vite fingerprints filenames) are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Same-origin proxy to the backend - the browser never needs to know its address, and
    # the app's default API base URL ("/api") works unchanged in dev (Vite proxy) and here.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MAX's webhook deliveries, relayed straight through to the backend. Lets the bot
    # webhook and the mini app share a single public domain/tunnel (e.g. one ngrok
    # tunnel in dev) instead of needing one each; incoming headers (including
    # X-Max-Bot-Api-Secret) pass through untouched.
    location = /webhook/max {
        proxy_pass http://backend:8000/webhook/max;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Presigned MinIO GET URLs the backend hands out for report photos. Path-style S3
    # addressing puts the bucket name first (/maxsmartcity-reports/<key>?<signature>), so
    # that's what's matched here - proxy_pass has no trailing URI, so the path (and the
    # signature's query string) reach MinIO exactly as received. The Host header must stay
    # untouched too: it's part of what got signed, so rewriting it would invalidate every
    # presigned URL. S3_PUBLIC_ENDPOINT_URL must be this same origin (see .env.example) so
    # what gets signed matches what the browser actually requests.
    location /maxsmartcity-reports/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths (client-side routes) fall back to index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
