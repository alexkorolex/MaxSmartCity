map $request_uri $backend_api_uri {
    ~^/api(?<rest>/.*)$ $rest;
    default /;
}

map $request_uri $map_service_uri {
    ~^/api(?<rest>/map/.*)$ $rest;
    default /map/;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $map_service http://map-service:8000;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/vnd.mapbox-vector-tile application/geo+json;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass $backend$backend_api_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/map/ {
        proxy_pass $map_service$map_service_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
