default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check
        name: ty type check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: stylelint-fix-frontend
        name: Stylelint autofix (frontend)
        entry: frontend/node_modules/.bin/stylelint --fix --config frontend/stylelint.config.js
        language: system
        files: ^frontend/.*\.css$

      - id: stylelint-fix-admin
        name: Stylelint autofix (admin)
        entry: admin/node_modules/.bin/stylelint --fix --config admin/stylelint.config.js
        language: system
        files: ^admin/.*\.css$

      - id: eslint
        name: ESLint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        always_run: true

      - id: frontend-typecheck
        name: TypeScript check (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
        always_run: true

      - id: eslint-admin
        name: ESLint (admin)
        entry: npm --prefix admin run lint
        language: system
        pass_filenames: false
        always_run: true

      - id: admin-typecheck
        name: TypeScript check (admin)
        entry: npm --prefix admin run typecheck
        language: system
        pass_filenames: false
        always_run: true
