default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check
        name: ty type check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
