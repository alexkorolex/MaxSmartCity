global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: maxsmartcity-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: maxsmartcity-map
    metrics_path: /metrics
    static_configs:
      - targets: ["map-service:8000"]
